# Netlify build settings for the MilkyLush site (Vite, pages: /, /about/, /privacy/, /terms/; unknown paths get public/404.html with a 404 status)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fingerprinted build output never changes, so cache it for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photos and video change rarely; revalidate daily-ish
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Sensible security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Deploy previews and branch deploys are built with <meta name="robots" content="noindex, nofollow">
# (see vite.config.ts) so staging copies never compete with the live site in search.
[context.deploy-preview.environment]
  VITE_NOINDEX = "true"
[context.branch-deploy.environment]
  VITE_NOINDEX = "true"

# One canonical host: www → apex (milkylush.com is what the existing site and its sitemap already use).
[[redirects]]
  from = "https://www.milkylush.com/*"
  to = "https://milkylush.com/:splat"
  status = 301
  force = true

# This site replaces the old milkylush.com pages. Each old URL 301-redirects to its closest equivalent here,
# so bookmarks, shared links and search rankings carry over. (The fragment takes visitors to the right section.)
[[redirects]]
  from = "/Aboutus.html"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/privacy.html"
  to = "/privacy/"
  status = 301
[[redirects]]
  from = "/shop.html"
  to = "/#shop"
  status = 301
[[redirects]]
  from = "/contact.html"
  to = "/#contact"
  status = 301
[[redirects]]
  from = "/trial.html"
  to = "/#get-started"
  status = 301
# The two blog articles have no page here yet, so the blog goes to the home page.
[[redirects]]
  from = "/blog.html"
  to = "/"
  status = 301
